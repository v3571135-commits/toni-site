<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Профиль</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #CC5500;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .profile-container {
            background-color: #000;
            width: 95%;
            max-width: 700px;
            padding: 40px;
            border: 2px solid #E65C00;
            border-radius: 10px;
            box-sizing: border-box;
            margin: 20px 0;
        }
        
        /* --- Стили для экрана регистрации --- */
        .register-title { text-align: center; color: #E65C00; margin-bottom: 10px; }
        .register-subtitle { text-align: center; color: #ccc; margin-bottom: 20px; }
        .avatar-selection { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .avatar-option {
            width: 60px; height: 60px; background-color: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: pointer; border: 3px solid transparent; transition: 0.2s;
        }
        .avatar-option:hover { transform: scale(1.1); }
        .avatar-option.selected { border-color: #E65C00; background-color: #555; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #E65C00; font-weight: bold; }
        input {
            width: 100%; padding: 12px; background-color: #1A1A1A;
            border: 1px solid #E65C00; color: white; border-radius: 5px;
            box-sizing: border-box; font-size: 16px;
        }
        input:focus { outline: none; border-color: #ff7700; }
        .btn {
            width: 100%; padding: 15px; background-color: #E65C00; color: black;
            border: none; border-radius: 5px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn:hover { background-color: #ff7700; }

        /* --- Стили для ЛИЧНОГО КАБИНЕТА --- */
        .profile-header { display: flex; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 20px;}
        .big-avatar {
            width: 100px; height: 100px; background-color: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 60px; border: 3px solid #E65C00; margin-right: 20px;
        }
        .profile-info-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1A1A1A; padding: 15px; border: 1px solid #333;
            border-radius: 5px; margin-bottom: 15px;
        }
        .profile-info-row span { font-size: 18px; color: #E65C00; font-weight: bold; }
        .btn-small {
            background-color: transparent; border: 1px solid #E65C00; color: #E65C00;
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
            transition: 0.3s;
        }
        .btn-small:hover { background-color: #E65C00; color: black; }
        
        .back-link {
            display: inline-block; margin-top: 20px; color: #E65C00;
            text-decoration: none; font-weight: bold; text-align: center; width: 100%;
        }
        .back-link:hover { text-decoration: underline; }
        .hidden { display: none; }
        /* Адаптивность для телефонов */
        max-width: 768px {
            body {
                flex-direction: column; /* Меняем расположение с горизонтального на вертикальное */
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%; /* Меню на всю ширину */
                border-right: none;
                border-bottom: 2px solid #E65C00;
                flex-direction: row; /* Кнопки в ряд */
                overflow-x: auto; /* Если не влезут, можно скроллить вбок */
                padding: 10px;
            }
            .sidebar a.menu-link {
                width: auto;
                white-space: nowrap;
                font-size: 12px; /* Чуть уменьшаем шрифт */
                padding: 8px 15px;
            }
            .main-content {
                padding: 10px;
            }
            .window, .robot-section, .chat-container, .header-box {
                width: 100%; /* Блоки на всю ширину экрана */
                margin-bottom: 15px;
            }
            .robot-section {
                flex-direction: column; /* Робота и кнопки ставим друг под другом */
                gap: 15px;
            }
            .chat-container {
                height: 400px; /* Фиксируем высоту чата для телефона */
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="register-screen">
            <h1 class="register-title">Регистрация в TONI</h1>
            <p class="register-subtitle">Выбери аватарку, придумай имя и уникальный ID</p>
            
            <div class="avatar-selection" id="avatar-picker">
                <div class="avatar-option selected" onclick="selectAvatar(this, '👤')">👤</div>
                <div class="avatar


ption" onclick="selectAvatar(this, '😎')">😎</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🕷️')">🕷️</div>
                <div class="avatar-option" onclick="selectAvatar(this, '⚡')">⚡</div>
            </div>

            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="reg-name" placeholder="Например, Питер">
            </div>
            <div class="form-group">
                <label>ID (латиницей)</label>
                <input type="text" id="reg-id" placeholder="Например, spiderman_01">
            </div>
            
            <button class="btn" onclick="register()">Создать аккаунт</button>
            <a href="/" class="back-link">← Вернуться в чат</a>
        </div>

        <!-- ЛИЧНЫЙ КАБИНЕТ (Показывается после входа) -->
        <div id="profile-screen" class="hidden">
            <div class="profile-header">
                <div class="big-avatar" id="display-avatar">👤</div>
                <div>
                    <h2 style="margin:0; color: #E65C00;">Мой профиль</h2>
                    <p style="margin:5px 0 0 0; color:#ccc;">Добро пожаловать в систему!</p>
                </div>
            </div>

            <!-- Блок аватарки -->
            <div class="profile-info-row">
                <div>Аватарка: <span id="display-avatar-text">👤</span></div>
                <button class="btn-small" onclick="alert('Выбор аватарки будет доступен позже!')">Выбрать</button>
            </div>

            <!-- Блок имени -->
            <div class="profile-info-row">
                <div>Имя: <span id="display-name">...</span></div>
                <button class="btn-small" onclick="alert('Смена имени будет доступна позже!')">Сменить имя</button>
            </div>

            <!-- Блок ID -->
            <div class="profile-info-row">
                <div>ID: <span id="display-id">...</span></div>
                <button class="btn-small" onclick="alert('Смена ID будет доступна позже!')">Сменить ID</button>
            </div>

            <button class="btn" onclick="changeAccount()" style="background-color: #333; color: #E65C00; border: 1px solid #E65C00; margin-top: 20px;">Выйти из аккаунта</button>
            <a href="/" class="back-link">← Вернуться в чат</a>
        </div>
    </div>

    <script>
        var currentAvatar = '👤';

        function selectAvatar(element, emoji) {
            var options = document.querySelectorAll('.avatar-option');
            for (var i = 0; i < options.length; i++) {
                options[i].classList.remove('selected');
            }
            element.classList.add('selected');
            currentAvatar = emoji;
        }

        window.onload = function() {
            var savedName = localStorage.getItem('toni_name');
            var savedId = localStorage.getItem('toni_id');
            var savedAvatar = localStorage.getItem('toni_avatar');
            
            if (savedName && savedId) {
                showProfile(savedName, savedId, savedAvatar || '👤');
            }
        };

        function register() {
          function register() {
            var name = document.getElementById('reg-name').value.trim();
            var id = document.getElementById('reg-id').value.trim();
            var avatar = window.currentAvatar || '👤';

            if (name === "" || id === "") {
                alert("Пожалуйста, заполни оба поля!");
                return;
            }

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, username: id, avatar: avatar})
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    localStorage.setItem('toni_user_id', data.user_id);
                    localStorage.setItem('toni_name', name);
                    localStorage.setItem('toni_id', id);
                    localStorage.setItem('toni_avatar', avatar);
                    showProfile(name, id, avatar);
                }
            });
        }

        function showProfile(name, id, avatar) {
            document.getElementById('register-screen').style.display = 'none';
            document.getElementById('profile-screen').classList.remove('hidden');
            
            // Заполняем данные в кабинете
            document.getElementById('display-avatar').innerText = avatar;


document.getElementById('display-avatar-text').innerText = avatar;
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-id').innerText = "@" + id;
        }

        function changeAccount() {
            localStorage.removeItem('toni_name');
            localStorage.removeItem('toni_id');
            localStorage.removeItem('toni_avatar');
            document.getElementById('profile-screen').classList.add('hidden');
            document.getElementById('register-screen').style.display = 'block';
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-id').value = '';
        }
    </script>
</body>
</html>-o
