<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Профиль</title>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .profile-container { background-color: #ffffff; width: 95%; max-width: 700px; padding: 40px; border: 2px solid #007bff; border-radius: 10px; box-sizing: border-box; margin: 20px 0; }
        .register-title { text-align: center; color: #007bff; margin-bottom: 10px; }
        .register-subtitle { text-align: center; color: #6c757d; margin-bottom: 20px; }
        .avatar-selection { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .avatar-option { width: 60px; height: 60px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 3px solid transparent; transition: 0.2s; box-sizing: border-box; }
        .avatar-option:hover { transform: scale(1.1); }
        .avatar-option.selected { border-color: #007bff; background-color: #cce5ff; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #007bff; font-weight: bold; }
        input { width: 100%; padding: 12px; background-color: #f8f9fa; border: 1px solid #dee2e6; color: #333; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: none; border-color: #007bff; }
        .btn { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #0056b3; }
        .profile-header { display: flex; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #dee2e6; padding-bottom: 20px; }
        .big-avatar { width: 100px; height: 100px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; border: 3px solid #007bff; margin-right: 20px; }
        .profile-info-row { display: flex; justify-content: space-between; align-items: center; background-color: #f8f9fa; padding: 15px; border: 1px solid #dee2e6; border-radius: 5px; margin-bottom: 15px; }
        .profile-info-row span { font-size: 18px; color: #007bff; font-weight: bold; }
        .btn-small { background-color: transparent; border: 1px solid #007bff; color: #007bff; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-small:hover { background-color: #007bff; color: white; }
        .back-link { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; text-align: center; width: 100%; }
        .back-link:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="register-screen">
            <h1 class="register-title">Регистрация в TONI</h1>
            <p class="register-subtitle">Выбери аватарку, придумай имя и уникальный ID</p>
            
            <div class="avatar-selection" id="avatar-picker">
                <div class="avatar-option selected" onclick="selectAvatar(this, '👤')">👤</div>
                <div class="avatar-option" onclick="selectAvatar(this, '😎')">😎</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🕷️')">🕷️</div>
                <div class="avatar-option" onclick="selectAvatar(this, '⚡')">⚡</div>
            </div>

            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="reg-name" placeholder="Например, Питер">
            </div>
            <div class="form-group">
                <label>ID (латиницей)</label>
                <input type="text" id="reg-id" placeholder="Например, spiderman_01">
            </div>
            <div class="form-group">
                <label>ID (латиницей)</label>
                <input type="text" id="reg-id" placeholder="Например, spiderman_01">
            </div>
            
            <!-- ВОТ ЭТОТ БЛОК ДОБАВЛЯЕМ -->
            <div class="form-group">
                <label>Почта</label>
                <input type="email" id="reg-email" placeholder="example@mail.com">
            </div>
            
            <button class="btn" onclick="register()">Создать аккаунт</button>
            <a href="/" class="back-link">← Вернуться в чат</a>
        </div>

        <!-- ЛИЧНЫЙ КАБИНЕТ -->
        <div id="profile-screen" class="hidden">
            <div class="profile-header">
                <div class="big-avatar" id="display-avatar">👤</div>
                <div>
                    <h2 style="margin:0; color: #E65C00;">Мой профиль</h2>
                    <p style="margin:5px 0 0 0; color:#ccc;">Добро пожаловать в систему!</p>
                </div>
            </div>

            <div class="profile-info-row">
                <div>Аватарка: <span id="display-avatar-text">👤</span></div>
                <button class="btn-small" onclick="alert('Выбор аватарки будет доступен позже!')">Выбрать</button>
            </div>
            <div class="profile-info-row">
                <div>Имя: <span id="display-name">...</span></div>
                <button class="btn-small" onclick="alert('Смена имени будет доступна позже!')">Сменить имя</button>
            </div>
            <div class="profile-info-row">
                <div>ID: <span id="display-id">...</span></div>
                <button class="btn-small" onclick="alert('Смена ID будет доступна позже!')">Сменить ID</button>
            </div>

            <button class="btn" onclick="changeAccount()" style="background-color: #333; color: #E65C00; border: 1px solid #E65C00; margin-top: 20px;">Выйти из аккаунта</button>
            <a href="/" class="back-link">← Вернуться в чат</a>
        </div>
    </div>

    <script>
        var currentAvatar = '👤';

        function selectAvatar(element, emoji) {
            var options = document.querySelectorAll('.avatar-option');
            for (var i = 0; i < options.length; i++) {
                options[i].classList.remove('selected');
            }
            element.classList.add('selected');
            currentAvatar = emoji;
        }

        window.onload = function() {
            var savedName = localStorage.getItem('toni_name');
            var savedId = localStorage.getItem('toni_id');
            var savedAvatar = localStorage.getItem('toni_avatar');
            
            if (savedName && savedId) {
                showProfile(savedName, savedId, savedAvatar || '👤');
            }
        };

        function register() {
           var name = document.getElementById('reg-name').value.trim();
            var id = document.getElementById('reg-id').value.trim();
            var email = document.getElementById('reg-email').value.trim(); // <-- ДОБАВИТЬ ЭТУ СТРОКУ
            var avatar = currentAvatar;
            }

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, username: id, avatar: avatar})
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    localStorage.setItem('toni_user_id', data.user_id);
                    localStorage.setItem('toni_name', name);
                    localStorage.setItem('toni_id', id);
                    localStorage.setItem('toni_avatar', avatar);
                    showProfile(name, id, avatar);
                }
            })
            .catch(err => {alert("Ошибка сервера. Попробуй еще раз.");
                console.error(err);
            });
        }

        function showProfile(name, id, avatar) {
            document.getElementById('register-screen').style.display = 'none';
            document.getElementById('profile-screen').classList.remove('hidden');
            
            document.getElementById('display-avatar').innerText = avatar;
            document.getElementById('display-avatar-text').innerText = avatar;
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-id').innerText = "@" + id;
        }

        function changeAccount() {
            localStorage.removeItem('toni_user_id');
            localStorage.removeItem('toni_name');
            localStorage.removeItem('toni_id');
            localStorage.removeItem('toni_avatar');
            document.getElementById('profile-screen').classList.add('hidden');
            document.getElementById('register-screen').style.display = 'block';
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-id').value = '';
        }
    </script>
</body>
</html>
