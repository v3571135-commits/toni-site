<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Профиль</title>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .profile-container { background-color: #ffffff; width: 95%; max-width: 500px; padding: 40px; border: 2px solid #007bff; border-radius: 10px; box-sizing: border-box; margin: 20px 0; }
        .title { text-align: center; color: #007bff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #007bff; font-weight: bold; }
        input { width: 100%; padding: 12px; background-color: #f8f9fa; border: 1px solid #dee2e6; color: #333; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #0056b3; }
        .btn-secondary { background-color: transparent; color: #007bff; border: 1px solid #007bff; margin-top: 10px; }
        .btn-secondary:hover { background-color: #e3f2fd; color: #0056b3; }
        .hidden { display: none; }
        
        .avatar-selection { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .avatar-option { width: 50px; height: 50px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 3px solid transparent; }
        .avatar-option.selected { border-color: #007bff; background-color: #cce5ff; }

        .profile-info { text-align: center; margin-bottom: 20px; }
        .big-avatar { width: 100px; height: 100px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; border: 3px solid #007bff; margin: 0 auto 10px; }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <!-- ЭКРАН ВХОДА -->
        <div id="login-screen">
            <h1 class="title">Вход в TONI</h1>
            <div class="form-group">
                <label>ID (латиницей)</label>
                <input type="text" id="login-id" placeholder="Например, spiderman_01">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Твой пароль">
            </div>
            <button class="btn" onclick="login()">Войти</button>
            <button class="btn btn-secondary" onclick="showRegister()">Создать новый аккаунт</button>
            <a href="/" style="display:block; text-align:center; margin-top:15px; color:#007bff;">← На главную</a>
        </div>

        <!-- ЭКРАН РЕГИСТРАЦИИ -->
        <div id="register-screen" class="hidden">
            <h1 class="title">Регистрация</h1>
            <div class="avatar-selection" id="avatar-picker">
                <div class="avatar-option selected" onclick="selectAvatar(this, '👤')">👤</div>
                <div class="avatar-option" onclick="selectAvatar(this, '😎')">😎</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</div>
                <div class="avatar-option" onclick="selectAvatar(this, '🕷️')">🕷️</div>
                <div class="avatar-option" onclick="selectAvatar(this, '⚡')">⚡</div>
            </div>
            <div class="form-group"><label>Имя</label><input type="text" id="reg-name" placeholder="Например, Питер"></div>
            <div class="form-group"><label>ID (латиницей)</label><input type="text" id="reg-id" placeholder="spiderman_01"></div>
            <div class="form-group"><label>Почта</label><input type="email" id="reg-email" placeholder="example@mail.com"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="reg-password" placeholder="примай пароль"></div>
            <button class="btn" onclick="register()">Создать аккаунт</button>
            <button class="btn btn-secondary" onclick="showLogin()">У меня уже есть аккаунт</button>
        </div>

        <!-- ЭКРАН УСТАНОВКИ ПАРОЛЯ (Для старых аккаунтов) -->
        <div id="set-password-screen" class="hidden">
            <h1 class="title">Установи пароль</h1>
            <p style="text-align:center; color:#6c757d;">Мы обновили безопасность! Придумай пароль для своего аккаунта, чтобы защитить его.</p>
            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="new-password" placeholder="Придумай пароль">
            </div>
            <button class="btn" onclick="saveNewPassword()">Сохранить пароль</button>
        </div>

        <!-- ЛИЧНЫЙ КАБИНЕТ -->
      <!-- ЛИЧНЫЙ КАБИНЕТ -->
        <div id="profile-screen" class="hidden">
            <div class="profile-info">
                <div class="big-avatar" id="display-avatar">👤</div>
                <h2 style="margin:0; color: #007bff;" id="display-name">Имя</h2>
                <p style="margin:5px 0 0 0; color:#6c757d;" id="display-id">@id</p>
            </div>

            <!-- Блоки настроек -->
            <div class="form-group">
                <label>Аватарка</label>
                <div class="avatar-selection" id="avatar-picker" style="margin-bottom: 10px;">
                    <div class="avatar-option" onclick="selectAvatar(this, '👤')">👤</div>
                    <div class="avatar-option" onclick="selectAvatar(this, '😎')">😎</div>
                    <div class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</div>
                    <div class="avatar-option" onclick="selectAvatar(this, '🕷️')">🕷️</div>
                    <div class="avatar-option" onclick="selectAvatar(this, '⚡')">⚡</div>
                </div>
                <button class="btn" onclick="updateProfile('avatar')" style="padding: 10px; font-size: 14px;">Сменить аватарку</button>
            </div>

            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="new-name" placeholder="Новое имя">
                <button class="btn" onclick="updateProfile('name')" style="padding: 10px; font-size: 14px; margin-top: 5px;">Сменить имя</button>
            </div>

            <div class="form-group">
                <label>ID</label>
                <input type="text" id="new-id" placeholder="Новый ID">
                <button class="btn" onclick="updateProfile('username')" style="padding: 10px; font-size: 14px; margin-top: 5px;">Сменить ID</button>
            </div>

            <button class="btn" onclick="logout()" style="background-color: #6c757d; margin-top: 20px;">Выйти из аккаунта</button>
            <a href="/" style="display:block; text-align:center; margin-top:15px; color:#007bff;">← Вернуться в чат</a>
        </div>
    </div>

    <script>
        var currentAvatar = '👤';
        var tempUserId = null;

        // При загрузке проверяем, залогинен ли пользователь (по старым данным в localStorage)
        window.onload = function() {
            var savedId = localStorage.getItem('toni_user_id');
            if (savedId) {
                // Если ID есть, показываем профиль (пока без проверки пароля при перезагрузке, для удобства)
                showProfile(localStorage.getItem('toni_name'), localStorage.getItem('toni_id'), localStorage.getItem('toni_avatar'));
            }
        };

        function showRegister() { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('register-screen').classList.remove('hidden'); }
        function showLogin() { document.getElementById('register-screen').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); }

        function selectAvatar(element, emoji) {
            var options = document.querySelectorAll('.avatar-option');
            for (var i = 0; i < options.length; i++) { options[i].classList.remove('selected'); }
            element.classList.add('selected');
            currentAvatar = emoji;
        }

        function login() {
            var id = document.getElementById('login-id').value.trim();
            var pw = document.getElementById('login-password').value;
            if (!id || !pw) { alert("Заполни все поля!"); return; }

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: id, password: pw})
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); }
                else if (data.need_password) {
                    // Старый пользователь без пароля
                    tempUserId = data.user_id;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('set-password-screen').classList.remove('hidden');
                } else {
                    // Успешный вход
                    localStorage.setItem('toni_user_id', data.user_id);
                    localStorage.setItem('toni_name', data.name);
                    localStorage.setItem('toni_id', data.username);
                    localStorage.setItem('toni_avatar', data.avatar);
                    showProfile(data.name, data.username, data.avatar);
                }
            });
        }

        function saveNewPassword() {
            var pw = document.getElementById('new-password').value;
            if (pw.length < 4) { alert("Пароль слишком короткий!"); return; }

            fetch('/api/set_password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: tempUserId, password: pw})
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert("Пароль установлен! Теперь можешь входить.");
                    localStorage.setItem('toni_user_id', data.user_id);
                    localStorage.setItem('toni_name', data.name);
                    localStorage.setItem('toni_id', data.username);
                    localStorage.setItem('toni_avatar', data.avatar);
                    showProfile(data.name, data.username, data.avatar);
                }
            });
        }

        function register() {
            var name = document.getElementById('reg-name').value.trim();
            var id = document.getElementById('reg-id').value.trim();
            var email = document.getElementById('reg-email').value.trim();
            var pw = document.getElementById('reg-password').value;

            if (!name || !id || !email || !pw) { alert("Заполни все поля!"); return; }

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, username: id, email: email, password: pw, avatar: currentAvatar})
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); }
                else {
                    localStorage.setItem('toni_user_id', data.user_id);
                    localStorage.setItem('toni_name', name);
                    localStorage.setItem('toni_id', id);
                    localStorage.setItem('toni_avatar', currentAvatar);
                    showProfile(name, id, currentAvatar);
                }
            });
        }

        function showProfile(name, id, avatar) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('set-password-screen').classList.add('hidden');
            document.getElementById('profile-screen').classList.remove('hidden');
            
            document.getElementById('display-avatar').innerText = avatar;
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-id').innerText = "@" + id;
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
