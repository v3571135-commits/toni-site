<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Подписка</title>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #CC5500; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { background-color: #000; width: 95%; max-width: 600px; padding: 50px 30px; border: 2px solid #E65C00; border-radius: 10px; text-align: center; box-sizing: border-box; }
        h1 { color: #E65C00; font-size: 36px; margin-bottom: 10px; }
        p { font-size: 18px; color: #ccc; line-height: 1.6; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 15px 40px; background-color: #E65C00; color: black; text-decoration: none; font-weight: bold; font-size: 18px; border-radius: 5px; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #E65C00; text-decoration: none; font-weight: bold; }
        /* Адаптивность для телефонов */
        max-width: 768px {
            body {
                flex-direction: column; /* Меняем расположение с горизонтального на вертикальное */
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%; /* Меню на всю ширину */
                border-right: none;
                border-bottom: 2px solid #E65C00;
                flex-direction: row; /* Кнопки в ряд */
                overflow-x: auto; /* Если не влезут, можно скроллить вбок */
                padding: 10px;
            }
            .sidebar a.menu-link {
                width: auto;
                white-space: nowrap;
                font-size: 12px; /* Чуть уменьшаем шрифт */
                padding: 8px 15px;
            }
            .main-content {
                padding: 10px;
            }
            .window, .robot-section, .chat-container, .header-box {
                width: 100%; /* Блоки на всю ширину экрана */
                margin-bottom: 15px;
            }
            .robot-section {
                flex-direction: column; /* Робота и кнопки ставим друг под другом */
                gap: 15px;
            }
            .chat-container {
                height: 400px; /* Фиксируем высоту чата для телефона */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>К сожалению,</h1>
        <p>Подписка пока недоступна. Тони все еще находится в стадии разработки, но он уже бесплатно отвечает на все твои вопросы!</p>
        <a href="/" class="btn">Вернуться к Тони</a>
        <a href="/" class="back-link">← В главное меню</a>
    </div>
</body>
</html>
