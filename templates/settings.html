<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Настройки</title>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; width: 95%; max-width: 800px; padding: 40px; border: 2px solid #007bff; border-radius: 10px; margin-top: 30px; box-sizing: border-box; }
        h1 { color: #007bff; text-align: center; margin-bottom: 30px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #dee2e6; font-size: 18px; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #007bff; }
        input:checked + .slider:before { transform: translateX(26px); }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }
        .sound-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .sound-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border: 1px solid #dee2e6; border-radius: 5px; }
        .play-btn { background: transparent; border: 1px solid #007bff; color: #007bff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .play-btn:hover { background: #007bff; color: white; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Настройки</h1>
        
        <div class="setting-row">
            <span>Включить уведомления</span>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" onchange="toggleNotifications(this)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Список звуков (появляется, если включены уведомления) -->
        <div id="sound-settings" style="display: none; padding: 15px 0; border-bottom: 1px solid #333;">
            <div style="color: #ccc; margin-bottom: 10px;">Выбери звук уведомления:</div>
            <div class="sound-list">
                <div class="sound-item">
                    <span>Звук 1</span>
                    <button class="play-btn" onclick="playSound('sound1.mp3')">▶ Играть</button>
                </div>
                <div class="sound-item">
                    <span>Звук 2</span>
                    <button class="play-btn" onclick="playSound('sound2.mp3')">▶ Играть</button>
                </div>
                <div class="sound-item">
                    <span>Звук 3</span>
                    <button class="play-btn" onclick="playSound('sound3.mp3')">▶ Играть</button>
                </div>
            </div>
            </div>
        </div>

        <div class="setting-row">
            <span>Темная тема</span>
            <label class="switch">
                <input type="checkbox" checked disabled>
                <span class="slider"></span>
            </label>
        </div>

        <a href="/" class="back-link">← Вернуться в чат</a>
    </div>

    <script>
        function toggleNotifications(checkbox) {
            var soundSettings = document.getElementById('sound-settings');
            if (checkbox.checked) {
                // Запрашиваем разрешение у браузера
                if (!("Notification" in window)) {
                    alert("Твой браузер не поддерживает уведомления.");
                    checkbox.checked = false;
                    return;
                }
                
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") {
                        soundSettings.style.display = 'block';
                        new Notification("Тони", { body: "Уведомления включены! Я напишу тебе, когда что-то произойдет." });
                    } else {
                        alert("Ты запретила уведомления в браузере.");
                        checkbox.checked = false;
                    }
                });
            } else {
                soundSettings.style.display = 'none';
            }
        }
        function playSound(fileName) {
            let audio = new Audio('/static/' + fileName); 
            audio.play().catch(e => alert("Ошибка: звук не найден. Убедись, что файл загружен в папку static на GitHub."));
        }
    </script>
</body>
</html>
