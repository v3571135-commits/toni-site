<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Настройки</title>
    <style>
        /* Создаем узор из шестеренок на фоне */
        body { 
            margin: 0; 
            font-family: 'Arial', sans-serif; 
            background-color: #CC5500; 
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 15a15 15 0 100 30 15 15 0 000-30zm0 24a9 9 0 110-18 9 9 0 010 18zm12.5-12.5l5.7-1.2-1.2-5.7-5.3 2.4a11 11 0 00-3.7-3.7l2.4-5.3-5.7-1.2-1.2 5.7a11 11 0 00-5.3 0l-1.2-5.7-5.7 1.2 2.4 5.3a11 11 0 00-3.7 3.7l-5.3-2.4-1.2 5.7 5.7 1.2a11 11 0 000 5.3l-5.7 1.2 1.2 5.7 5.3-2.4a11 11 0 003.7 3.7l-2.4 5.3 5.7 1.2 1.2-5.7a11 11 0 005.3 0l1.2 5.7 5.7-1.2-2.4-5.3a11 11 0 003.7-3.7l5.3 2.4 1.2-5.7-5.7-1.2a11 11 0 000-5.3z' fill='%23B34700' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            background-color: #000; 
            width: 95%; 
            max-width: 800px; /* Сделали окно шире */
            padding: 40px; 
            border: 2px solid #E65C00; 
            border-radius: 10px; 
            box-sizing: border-box; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #E65C00; text-align: center; margin-bottom: 30px; }
        .setting-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 0; 
            border-bottom: 1px solid #333; 
            font-size: 18px; 
        }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #E65C00; }
        input:checked + .slider:before { transform: translateX(26px); }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

        /* Стили для списка звуков */
        .sound-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .sound-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1A1A1A; padding: 15px; border: 1px solid #333; border-radius: 5px;
        }
        .play-btn {
            background: transparent; border: 1px solid #E65C00; color: #E65C00;
            padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .play-btn:hover { background: #E65C00; color: black; }

        .back-link { display: block; text-align: center; margin-top: 30px; color: #E65C00; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Настройки</h1>
        
        <div class="setting-row">
            <span>Включить уведомления</span>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" onchange="toggleNotifications(this)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Список звуков (появляется, если включены уведомления) -->
        <div id="sound-settings" style="display: none; padding: 15px 0; border-bottom: 1px solid #333;">
            <div style="color: #ccc; margin-bottom: 10px;">Выбери звук уведомления:</div>
            <div class="sound-list">
                <div class="sound-item">
                    <span>Звук 1 (Классика)</span>
                    <button class="play-btn" onclick="alert('Играет звук 1! (Функция в


ке)')">▶ Играть</button>
                </div>
                <div class="sound-item">
                    <span>Звук 2 (Синтезатор)</span>
                    <button class="play-btn" onclick="alert('Играет звук 2! (Функция в разработке)')">▶ Играть</button>
                </div>
                <div class="sound-item">
                    <span>Звук 3 (Писк Тони)</span>
                    <button class="play-btn" onclick="alert('Играет звук 3! (Функция в разработке)')">▶ Играть</button>
                </div>
            </div>
        </div>

        <div class="setting-row">
            <span>Темная тема</span>
            <label class="switch">
                <input type="checkbox" checked disabled>
                <span class="slider"></span>
            </label>
        </div>

        <a href="/" class="back-link">← Вернуться в чат</a>
    </div>

    <script>
        function toggleNotifications(checkbox) {
            var soundSettings = document.getElementById('sound-settings');
            if (checkbox.checked) {
                // Запрашиваем разрешение у браузера
                if (!("Notification" in window)) {
                    alert("Твой браузер не поддерживает уведомления.");
                    checkbox.checked = false;
                    return;
                }
                
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") {
                        soundSettings.style.display = 'block';
                        new Notification("Тони", { body: "Уведомления включены! Я напишу тебе, когда что-то произойдет." });
                    } else {
                        alert("Ты запретила уведомления в браузере.");
                        checkbox.checked = false;
                    }
                });
            } else {
                soundSettings.style.display = 'none';
            }
        }
    </script>
</body>
</html>
