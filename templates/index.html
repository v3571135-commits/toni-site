<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI - Твой помощник</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #CC5500;
            color: white;
            display: flex;
            min-height: 100vh;
        }
        
        /* Левое меню (для компьютера) */
        .sidebar {
            width: 220px;
            background-color: #000000;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 2px solid #E65C00;
            align-items: center;
            flex-shrink: 0;
        }
        .profile-btn {
            width: 60px; height: 60px; background-color: #333; border-radius: 50%;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 2px solid #E65C00; text-decoration: none; color: white;
        }
        .sidebar a.menu-link {
            width: 100%; color: #E65C00; text-decoration: none; background-color: #1A1A1A;
            padding: 10px; border-radius: 20px; text-align: center;
            font-size: 14px; font-weight: bold; border: 1px solid #333; transition: 0.3s;
        }
        .sidebar a.menu-link:hover { background-color: #E65C00; color: #000; }
        
        /* Основная часть */
        .main-content {
            flex: 1; padding: 20px; display: flex; flex-direction: column;
            align-items: center; overflow-y: auto; max-width: 100%;
        }
        
        .header-box {
            background-color: #000; width: 98%; text-align: center;
            padding: 10px; margin-bottom: 20px; border: 2px solid #000;
        }
        .header-box h1 { margin: 0; color: #E65C00; font-size: 50px; font-family: 'Times New Roman', serif; font-style: italic; letter-spacing: 5px; }
        .header-box p { margin: 0; color: #E65C00; font-size: 16px; font-style: italic; }

        .robot-section {
            background-color: #000; width: 98%; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border: 2px solid #E65C00;
        }
        .robot-img { width: 150px; height: 150px; background-color: #E65C00; display: flex; align-items: center; justify-content: center; font-size: 80px; flex-shrink: 0;}
        .action-buttons { display: flex; flex-direction: column; gap: 15px; }
        .action-btn { display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-size: 16px; }
        .plus-circle { width: 30px; height: 30px; border-radius: 50%; background-color: #E65C00; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }

        .chat-container {
            background-color: #000; width: 98%; border: 2px solid #E65C00;
            padding: 20px; display: flex; flex-direction: column; height: 400px;
        }
        .messages { flex: 1; overflow-y: auto; margin-bottom: 15px; font-size: 18px; }
        .message { margin-bottom: 10px; }
        .user-msg { color: #ccc; }
        .toni-msg { color: #E65C00; }
        
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 15px; border: 1px solid #E65C00; background-color: #1A1A1A; color: white; font-size: 16px; border-radius: 5px; }
        button { padding: 15px 30px; background-color: #E65C00; border: none; color: black; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #ff7700; }

        .quick-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; margin-bottom: 10px; }
        .quick-buttons button { background-color: #1A1A1A; border: 1px solid #E65C00; color: #E65C00; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.3s; width:
            uto; }
        .quick-buttons button:hover { background-color: #E65C00; color: black; }

        /* МАГИЯ ДЛЯ ТЕЛЕФОНОВ */
        max-width: 768px {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; border-right: none; border-bottom: 2px solid #E65C00;
                flex-direction: row; overflow-x: auto; padding: 10px; justify-content: flex-start;
                align-items: center;
            }
            .profile-btn { margin-bottom: 0; margin-right: 10px; width: 40px; height: 40px; font-size: 20px; flex-shrink: 0; }
            .sidebar a.menu-link { width: auto; white-space: nowrap; padding: 8px 12px; font-size: 12px; flex-shrink: 0; }
            
            .main-content { padding: 10px; }
            .header-box h1 { font-size: 36px; }
            .robot-section { flex-direction: column; gap: 15px; }
            .chat-container { height: 350px; padding: 10px; }
            .input-area { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="/profile" class="profile-btn">👤</a>
        <a href="/profile" class="menu-link">Личный кабинет</a>
        <a href="/settings" class="menu-link">Настройки</a>
        <a href="/subscription" class="menu-link">Подписка</a>
        <a href="/history" class="menu-link">История</a>
        <a href="/reviews" class="menu-link">Отзывы</a>
        <a href="/users" class="menu-link">Другие пользователи</a>
    </div>

    <div class="main-content">
        <div class="header-box">
            <h1>TONI</h1>
            <p>бесплатный помощник</p>
        </div>

        <div class="robot-section">
            <div class="robot-img">🤖</div>
            <div class="action-buttons">
                <a href="/reviews" class="action-btn"><div class="plus-circle">+</div> оставить отзыв</a>
                <a href="/suggest" class="action-btn"><div class="plus-circle">+</div> предложить функцию</a>
                <a href="/creator" class="action-btn"><div class="plus-circle">+</div> чат с создателем</a>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="chat-box">
                <div class="message toni-msg">Привет, я — Тони. Помощник по сайту! Что ты хочешь спросить?</div>
                <div class="quick-buttons" id="quick-buttons">
                    <button onclick="askQuick('Как зарегистрироваться?')">Как зарегистрироваться?</button>
                    <button onclick="askQuick('Как найти друзей?')">Как найти друзей?</button>
                    <button onclick="askQuick('Как оставить отзыв?')">Как оставить отзыв?</button>
                    <button onclick="askQuick('Что в настройках?')">Что в настройках?</button>
                    <button onclick="askQuick('История сайта')">История сайта</button>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(e) { if (e.key === "Enter") sendMessage(); }
        
        function askQuick(question) {
            document.getElementById('user-input').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user-msg">Ты: ${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `<div class="message toni-msg" id="loading">Тони: <i>думает...</i></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text})
                });
                const data = await response.json();
                document.getElementById("loading").remove();
                if (data.error) {
                     chatBox.innerHTML += `<div class="message toni-msg" style="color:red;">Тони: ${data.error}</div>`;
                } else {
                     chatBox.innerHTML += `<div class="message toni-msg">Тони: ${data.answer}</div>`;
                }
            } catch (e) {
                document.getElementById("loading").remove();
                chatBox.innerHTML += `<div class="message toni-msg" style="color:red;">Тони: Ошибка сети</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html> a
