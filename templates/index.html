<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Твой помощник</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; display: flex; height: 100vh; color: #333; }
        .sidebar { width: 220px; background-color: #ffffff; padding: 20px 10px; display: flex; flex-direction: column; gap: 10px; border-right: 2px solid #007bff; align-items: center; flex-shrink: 0; }
        .profile-btn { width: 60px; height: 60px; background-color: #e9ecef; border-radius: 50%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 2px solid #007bff; text-decoration: none; color: #333; }
        .sidebar a.menu-link { width: 100%; color: #007bff; text-decoration: none; background-color: #f8f9fa; padding: 10px; border-radius: 20px; text-align: center; font-size: 14px; font-weight: bold; border: 1px solid #dee2e6; transition: 0.3s; }
        .sidebar a.menu-link:hover { background-color: #007bff; color: #fff; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .header-box { background-color: #ffffff; width: 98%; text-align: center; padding: 10px; margin-bottom: 20px; border: 2px solid #dee2e6; border-radius: 10px; }
        .header-box h1 { margin: 0; color: #007bff; font-size: 50px; font-family: 'Times New Roman', serif; font-style: italic; letter-spacing: 5px; }
        .header-box p { margin: 0; color: #6c757d; font-size: 16px; font-style: italic; }
        .robot-section { background-color: #ffffff; width: 98%; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 2px solid #007bff; border-radius: 10px; }
        .robot-img { width: 150px; height: 150px; background-color: #e3f2fd; display: flex; align-items: center; justify-content: center; font-size: 80px; border-radius: 10px; }
        .action-buttons { display: flex; flex-direction: column; gap: 15px; }
        .action-btn { display: flex; align-items: center; gap: 10px; color: #333; text-decoration: none; font-size: 16px; }
        .plus-circle { width: 30px; height: 30px; border-radius: 50%; background-color: #007bff; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .chat-container { background-color: #ffffff; width: 98%; border: 2px solid #007bff; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; height: 400px; }
        .messages { flex: 1; overflow-y: auto; margin-bottom: 15px; font-size: 18px; }
        .message { margin-bottom: 10px; }
        .user-msg { color: #6c757d; }
        .toni-msg { color: #007bff; font-weight: bold; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 15px; border: 1px solid #dee2e6; background-color: #f8f9fa; color: #333; font-size: 16px; border-radius: 5px; }
        button { padding: 15px 30px; background-color: #007bff; border: none; color: white; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="/profile" class="profile-btn">👤</a>
        <a href="/profile" class="menu-link">Личный кабинет</a>
        <a href="/settings" class="menu-link">Настройки</a>
        <a href="/subscription" class="menu-link">Подписка</a>
        <a href="/history" class="menu-link">История</a>
        <a href="/reviews" class="menu-link">Отзывы</a>
        
        <!-- ВОТ ЭТА КНОПКА ДОЛЖНА БЫТЬ ТАКОЙ -->
        <a href="/users" class="menu-link" style="position: relative;">
            Другие пользователи
            <span id="main-unread-badge" style="display: none; position: absolute; top: 5px; right: 10px; width: 10px; height: 10px; background: red; border-radius: 50%; border: 2px solid white;"></span>
        </a>
    </div>

    <div class="main-content">
        <div class="header-box">
            <h1>TONI</h1>
            <p>бесплатный помощник</p>
        </div>

        <div class="robot-section">
            <div class="robot-img">🤖</div>
            <div class="action-buttons">
                <a href="/reviews" class="action-btn"><div class="plus-circle">+</div> оставить отзыв</a>
                <a href="/suggest" class="action-btn"><div class="plus-circle">+</div> предложить функцию</a>
                <a href="/creator" class="action-btn"><div class="plus-circle">+</div> чат с создателем</a>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="chat-box">
                <div class="message toni-msg">Привет! Я — Тони, твой помощник.</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            
            chatBox.innerHTML += `<div class="message user-msg">Ты: ${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `<div class="message toni-msg" id="loading">Тони: <i>думает...</i></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text})
                });
                const data = await response.json();
                
                document.getElementById("loading").remove();

                if (data.error) {
                     chatBox.innerHTML += `<div class="message toni-msg" style="color:red;">Тони: ${data.error}</div>`;
                } else {
                     chatBox.innerHTML += `<div class="message toni-msg">Тони: ${data.answer}</div>`;
                }
            } catch (e) {
                document.getElementById("loading").remove();
                chatBox.innerHTML += `<div class="message toni-msg" style="color:red;">Тони: Ошибка сети</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        // Проверка уведомлений на главной странице
        var myUserId = parseInt(localStorage.getItem('toni_user_id'));
        
        function checkMainNotifications() {
            if (!myUserId) return;
            
            fetch('/api/chats/' + myUserId)
            .then(function(res) { return res.json(); })
            .then(function(chats) {
                var hasUnread = false;
                for (var i = 0; i < chats.length; i++) {
                    if (chats[i].unread) hasUnread = true;
                }
                
                var badge = document.getElementById('main-unread-badge');
                if (badge) {
                    badge.style.display = hasUnread ? 'block' : 'none';
                }
            });
        }

        // Запускаем проверку каждые 3 секунды, если пользователь авторизован
        if (myUserId) {
            setInterval(checkMainNotifications, 3000);
            checkMainNotifications(); // Первый запуск
        }
    </script>
</body>
</html>
