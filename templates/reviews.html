<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Отзывы</title>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; width: 95%; max-width: 800px; padding: 40px; border: 2px solid #007bff; border-radius: 10px; margin-top: 30px; margin-bottom: 30px; box-sizing: border-box; }
        h1 { color: #007bff; text-align: center; margin-top: 0; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #dee2e6; margin-bottom: 30px; }
        .stars { font-size: 40px; color: #dee2e6; cursor: pointer; text-align: center; margin-bottom: 5px; user-select: none; }
        .star { transition: color 0.2s; }
        .star:hover { color: #007bff; }
        .star.active { color: #ffc107; } /* Желтые звезды */
        .rating-text { text-align: center; color: #6c757d; margin-bottom: 15px; font-size: 16px; }
        textarea { width: 100%; height: 80px; background-color: #ffffff; border: 1px solid #dee2e6; color: #333; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: none; font-family: Arial; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
        .reviews-list { display: flex; flex-direction: column; gap: 15px; }
        .review-card { background-color: #f8f9fa; border-left: 5px solid #007bff; padding: 15px; border-radius: 5px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .review-stars { color: #ffc107; font-size: 20px; }
        .review-actions button { background: transparent; border: none; color: #6c757d; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .review-actions button:hover { color: #007bff; }
        .review-text { margin: 0; font-size: 16px; line-height: 1.5; color: #495057;}
        .no-reviews { text-align: center; color: #6c757d; font-style: italic; padding: 20px;}
        .back-link { display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Отзывы о Тони</h1>
        <!-- Блок среднего рейтинга -->
        <div style="text-align: center; margin-bottom: 20px; background: #1A1A1A; padding: 15px; border-radius: 10px; border: 1px solid #333;">
            <div style="font-size: 40px; color: #E65C00; font-weight: bold;" id="avg-rating">0.0</div>
            <div style="color: #ccc; font-size: 14px;">Средняя оценка (<span id="total-reviews">0</span> отзывов)</div>
        </div>
        
        <!-- Форма -->
        <div class="form-section">
            <div class="stars" id="star-container">
                <span onclick="setRating(1)">★</span>
                <span onclick="setRating(2)">★</span>
                <span onclick="setRating(3)">★</span>
                <span onclick="setRating(4)">★</span>
                <span onclick="setRating(5)">★</span>
            </div>
            <div class="rating-text" id="rating-text">Поставь оценку:</div>
            <textarea id="review-text" placeholder="Напиши, что тебе нравится в Тони..."></textarea>
            <button class="btn" id="submit-btn" onclick="addReview()">Оставить отзыв</button>
        </div>

        <!-- Список -->
        <h2 style="color: #E65C00; font-size: 22px; margin-bottom: 15px;">Мнения пользователей:</h2>
        <div class="reviews-list" id="reviews-list">
            <!-- Сюда будут добавляться отзывы -->
        </div>

        <a href="/" class="back-link">← Вернуться в чат</a>
    </div>

    <script>
        let currentRating = 0;
        let editingIndex = -1; // -1 значит мы создаем новый отзыв

        // Установка звезд
       function setRating(n) {
            currentRating = n;
            let stars = document.querySelectorAll('#star-container span');
            for (let i = 0; i < stars.length; i++) {
                if (i < n) stars[i].classList.add('active');
                else stars[i].classList.remove('active');
            }
            
            // Обновляем текст под звездами
            let textEl = document.getElementById('rating-text');
            if (n > 0) {
                textEl.innerText = "Твоя оценка: " + n + " из 5";
            } else {
                textEl.innerText = "Поставь оценку:";
            }
        }

        // Показ отзывов
        function renderReviews() {
            let list = document.getElementById('reviews-list');
            let saved = localStorage.getItem('toni_reviews');
            let reviews = saved ? JSON.parse(saved) : [];

            // --- ПОДСЧЕТ СРЕДНЕГО РЕЙТИНГА ---
            let totalRating = 0;
            reviews.forEach(rev => { totalRating += rev.rating; });
            
            let avgRating = reviews.length > 0 ? (totalRating / reviews.length).toFixed(1) : "0.0";
            
            // Выводим на экран
            if(document.getElementById('avg-rating')) {
                document.getElementById('avg-rating').innerText = avgRating;
                document.getElementById('total-reviews').innerText = reviews.length;
            }
            // ----------------------------------

            list.innerHTML = ''; // Очищаем список

            if (reviews.length === 0) {
                list.innerHTML = '<div class="no-reviews">Отзывов пока нет. Будь первым!</div>';
                return;
            }

            reviews.forEach((review, index) => {
                let starsHTML = '';
                for(let i=0; i<5; i++) {
                    starsHTML += (i < review.rating) ? '★' : '☆';
                }

                let card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="review-header">
                        <div class="review-stars">${starsHTML}</div>
                        <div class="review-actions">
                            <button onclick="editReview(${index})">Редактировать</button>
                            <button onclick="deleteReview(${index})" style="color: #ff4444;">Удалить</button>
                        </div>
                    </div>
                    <p class="review-text">${review.text}</p>
                `;
                list.appendChild(card);
            });
        }

        // Добавление или сохранение изменений
        function addReview() {
            let text = document.getElementById('review-text').value.trim();
            if (!text) { alert("Напиши текст отзыва!"); return; }
            if (currentRating === 0) { alert("Поставь оценку (звезды)!"); return; }

            let saved = localStorage.getItem('toni_reviews');
            let reviews = saved ? JSON.parse(saved) : [];

            if (editingIndex > -1) {
                // Редактируем
                reviews[editingIndex] = { rating: currentRating, text: text };
                editingIndex = -1;
                document.getElementById('submit-btn').innerText = "Оставить отзыв";
            } else {
                // Добавляем новый
                reviews.push({ rating: currentRating, text: text });
            }

            localStorage.setItem('toni_reviews', JSON.stringify(reviews));
            
            // Очищаем форму
            document.getElementById('review-text').value = '';
            setRating(0);
            renderReviews();
        }

        // Удаление
        function deleteReview(index) {
            if (!confirm("Точно удалить этот отзыв?")) return;
            let saved = localStorage.getItem('toni_reviews');
            let reviews = saved ? JSON.parse(saved) : [];
            reviews.splice(index, 1);
            localStorage.setItem('toni_reviews', JSON.stringify(reviews));
            renderReviews();
        }

        // Редактирование
        function editReview(index) {
            let saved = localStorage.getItem('toni_reviews');
            let reviews = saved ? JSON.parse(saved) : [];
            let rev = reviews[index];

            document.getElementById('review-text').value = rev.text;
            setRating(rev.rating);
            editingIndex = index;
            
            document.getElementById('submit-btn').innerText = "Сохранить изменения";
            window.scrollTo(0, 0); // Прокрутка наверх к форме
        }

        // При загрузке страницы показываем отзывы
        window.onload = renderReviews;
    </script>
</body>
</html>
