<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Мессенджер</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background-color: #ffffff; padding: 20px 10px; display: flex; flex-direction: column; gap: 10px; border-right: 2px solid #007bff; flex-shrink: 0; }
        .sidebar a { color: #007bff; text-decoration: none; background-color: #f8f9fa; padding: 12px; border-radius: 20px; text-align: center; font-weight: bold; border: 1px solid #dee2e6; transition: 0.3s; cursor: pointer; position: relative;}
        .sidebar a:hover { background-color: #007bff; color: white; }
        .main-content { flex: 1; display: flex; background-color: #ffffff; }
        .chat-list { width: 320px; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; background: #f8f9fa; }
        .search-bar { padding: 15px; border-bottom: 1px solid #dee2e6; display: flex; gap: 5px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 14px; }
        .search-bar button { padding: 0 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-results { max-height: 200px; overflow-y: auto; border-bottom: 1px solid #dee2e6; background: #fff; }
        .search-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        .search-item:hover { background: #e9ecef; }
        .chats-container { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; position: relative; }
        .chat-item:hover { background: #e9ecef; }
        .chat-item.active { background: #cce5ff; border-left: 4px solid #007bff; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: bold; color: #333; }
        .chat-desc { color: #6c757d; font-size: 13px; }
        .unread-badge { width: 12px; height: 12px; background-color: #007bff; border-radius: 50%; display: none; }
        .unread-badge.show { display: block; }
        .chat-window { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        .chat-header { padding: 15px; border-bottom: 1px solid #dee2e6; display: flex; align-items: center; gap: 15px; background: #ffffff; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f0f4f8; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-wrap: break-word; }
        .msg.my { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg.their { background-color: #ffffff; color: #333; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #dee2e6; }
        .chat-input-area { padding: 15px; border-top: 1px solid #dee2e6; display: flex; gap: 10px; background: #ffffff; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 20px; font-size: 16px; outline: none; }
        .chat-input-area button { padding: 0 20px; background-color: #007bff; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #6c757d; font-size: 18px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/profile">👤 Профиль</a>
        <a href="/users" style="background-color: #007bff; color: white;">
            💬 Мои чаты
            <span id="menu-unread-badge" style="display: none; position: absolute; top: 8px; right: 15px; width: 12px; height: 12px; background: red; border-radius: 50%; border: 2px solid white;"></span>
        </a>
        <a onclick="openChat(0, 'Заметки', '🔒')">📝заметки</a>
        <a href="/">← На главную</a>
    </div>

    <div class="main-content">
        <div class="chat-list">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск..." onkeypress="if(event.key==='Enter') searchUsers()">
                <button type="button" onclick="searchUsers()">Найти</button>
            </div>
            <div class="search-results" id="search-results"></div>
            <div class="chats-container" id="chats-container">
                <div class="chat-item" onclick="openChat(0, 'Заметки', '🔒')">
                    <div style="font-size: 24px;">🔒</div>
                    <div class="chat-info">
                        <div class="chat-name">Заметки</div>
                        <div class="chat-desc">Твой личный блокнот</div>
                    </div>
                </div>
                <div id="active-chats-list"></div>
            </div>
        </div>

        <div class="chat-window">
            <div class="empty-chat" id="empty-state">Выбери чат или найди пользователя</div>
            <div id="active-chat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div style="font-size: 30px;" id="header-avatar">👤</div>
                    <div>
                        <h3 style="margin: 0;" id="header-name">Имя</h3>
                        <small style="color: #6c757d;" id="header-id">@id</small>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button type="button" onclick="sendMsg()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var myUserId = parseInt(localStorage.getItem('toni_user_id'));
        var currentChatId = null;
        var lastPlayedSoundId = 0; // Чтобы звук не спамил

        if (!myUserId) {
            alert("Сначала зарегистрируйся в профиле!");
            window.location.href = "/profile";
        }

        function playSound() {
            if (localStorage.getItem('toni_notifications') === 'true') {
                var sound = localStorage.getItem('toni_sound') || 'sound1.mp3';
                var audio = new Audio('/static/' + sound);
                audio.play().catch(function() {});
            }
        }

        function loadChatList() {
            fetch('/api/chats/' + myUserId)
            .then(function(res) { return res.json(); })
            .then(function(chats) {
                var listDiv = document.getElementById('active-chats-list');
                var hasUnread = false;
                listDiv.innerHTML = '';

                for (var i = 0; i < chats.length; i++) {
                    var c = chats[i];
                    
                    // Если есть непрочитанное и мы не в этом чате
                    if (c.unread) {
                        hasUnread = true;
                        // Если ID сообщения больше того, на которое мы уже реагировали — играем звук
                        if (c.last_msg_id > lastPlayedSoundId && currentChatId !== c.id) {
                            playSound();
                            lastPlayedSoundId = c.last_msg_id;
                        }
                    }
                    
                    var unreadClass = c.unread ? 'show' : '';
                    var activeClass = (currentChatId === c.id) ? 'active' : '';
                    
                    listDiv.innerHTML += '<div class="chat-item ' + activeClass + '" onclick="openChat(' + c.id + ', \'' + c.name + '\', \'' + c.avatar + '\')">' +
                        '<div style="font-size: 24px;">' + c.avatar + '</div>' +
                        '<div class="chat-info"><div class="chat-name">' + c.name + '</div>' +
                        '<div class="chat-desc">@' + c.username + '</div></div>' +
                        '<div class="unread-badge ' + unreadClass + '"></div></div>';
                }

                var menuBadge = document.getElementById('menu-unread-badge');
                if (menuBadge) menuBadge.style.display = hasUnread ? 'block' : 'none';
            });
        }

        function searchUsers() {
            var query = document.getElementById('search-input').value.trim();
            var resDiv = document.getElementById('search-results');
            if (query.length < 2) return;
            resDiv.innerHTML = '<div style="padding:10px; color:#888;">Ищу...</div>';
            fetch('/api/search_users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            })
            .then(function(res) { return res.json(); })
            .then(function(users) {
                resDiv.innerHTML = '';
                if (users.length === 0) { resDiv.innerHTML = '<div style="padding:10px; color:#888;">Не найден</div>'; return; }
                for (var i = 0; i < users.length; i++) {
                    var u = users[i];
                    resDiv.innerHTML += '<div class="search-item" onclick="openChat(' + u.id + ', \'' + u.name + '\', \'' + u.avatar + '\')">' +
                        '<span style="font-size: 20px;">' + u.avatar + '</span>' +
                        '<div><b>' + u.name + '</b> <small style="color:#6c757d;">@' + u.username + '</small></div></div>';
                }
            });
        }

        function openChat(id, name, avatar) {
            currentChatId = id;
            document.getElementById('search-results').innerHTML = '';
            document.getElementById('search-input').value = '';
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('active-chat').style.display = 'flex';
            document.getElementById('header-avatar').innerText = avatar;
            document.getElementById('header-name').innerText = name;
            document.getElementById('header-id').innerText = id === 0 ? "Личное" : "ID: " + id;
            
            // Помечаем как прочитанные (только если это не заметки)
            if (id !== 0) {
                fetch('/api/messages/read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({from_id: id, my_id: myUserId})
                }).then(function() { loadChatList(); });
            }
            
            loadMessages();
            if (window.chatInterval) clearInterval(window.chatInterval);
            window.chatInterval = setInterval(loadMessages, 2000);
        }

        function loadMessages() {
            if (currentChatId === null) return;
            var targetId = (currentChatId === 0) ? myUserId : currentChatId;
            fetch('/api/messages/' + myUserId + '/' + targetId)
            .then(function(res) { return res.json(); })
            .then(function(msgs) {
                var box = document.getElementById('chat-messages');
                var wasAtBottom = box.scrollHeight - box.scrollTop === box.clientHeight;
                box.innerHTML = '';
                for (var i = 0; i < msgs.length; i++) {
                    var m = msgs[i];
                    var isMine = (m.sender_id === myUserId);
                    var cls = isMine ? 'my' : 'their';
                    var safeText = m.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    box.innerHTML += '<div class="msg ' + cls + '">' + safeText + '</div>';
                }
                if (wasAtBottom) box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            var text = document.getElementById('msg-input').value.trim();
            if (!text || currentChatId === null) return;
            var targetId = (currentChatId === 0) ? myUserId : currentChatId;
            fetch('/api/messages/send', {
                method: 'POST',headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sender_id: myUserId, receiver_id: targetId, text: text})
            }).then(function() {
                document.getElementById('msg-input').value = '';
                loadMessages();
                loadChatList(); 
            });
        }

        window.onload = function() {
            loadChatList();
            setInterval(loadChatList, 3000); // Обновляем список чатов и проверяем новые сообщения каждые 3 сек
        };
    </script>
</body>
</html>
