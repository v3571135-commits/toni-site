<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TONI - Мессенджер</title>
   <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background-color: #f0f4f8; color: #333; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background-color: #ffffff; padding: 20px 10px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid #007bff; box-sizing: border-box; }
        .sidebar a { color: #007bff; text-decoration: none; background-color: #f8f9fa; padding: 12px; border-radius: 20px; text-align: center; font-weight: bold; border: 1px solid #dee2e6; transition: 0.3s; }
        .sidebar a:hover { background-color: #007bff; color: white; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow-y: auto; }
        .window { background-color: #ffffff; width: 98%; min-height: 95vh; border: 2px solid #007bff; border-radius: 10px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; }
        h1 { color: #007bff; text-align: center; margin-top: 0; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; color: #333; border-radius: 5px; font-size: 16px; }
        .search-bar button { padding: 0 25px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .chat-area { display: none; flex-direction: column; flex: 1; }
        .chat-header { display: flex; align-items: center; gap: 15px; padding-bottom: 15px; border-bottom: 2px solid #dee2e6; margin-bottom: 15px; }
        .chat-messages { flex: 1; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; padding: 15px; margin-bottom: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; }
        .msg.my { background-color: #007bff; color: white; align-self: flex-end; }
        .msg.their { background-color: #e9ecef; color: #333; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; color: #333; border-radius: 5px; }
        .chat-input-area button { padding: 0 25px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/">← Назад в Тони</a>
        <a href="#" onclick="logout()">Выйти</a>
    </div>

    <div class="main-content">
        <div class="window">
            <div id="search-view">
                <h1>Поиск пользователей</h1>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Введи ID или Имя...">
                    <button onclick="searchUser()">Найти</button>
                </div>
                <div id="search-result"></div>
            </div>

            <div id="chat-view" class="chat-area">
                <button onclick="backToSearch()" style="background: none; border: none; color: #E65C00; cursor: pointer; text-align: left; margin-bottom: 10px;">← Назад к поиску</button>
                <div class="chat-header">
                    <div style="font-size: 30px;" id="chat-avatar">👤</div>
                    <div>
                        <h2 id="chat-name" style="margin:0; color:#E65C00;">Имя</h2>
                        <p id="chat-username" style="margin:0; color:#888;">@id</p>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()">➤</button>
                </div>
            <


div>
        </div>
    </div>

    <script>
        let currentChatUser = null;
        let myUserId = localStorage.getItem('toni_user_id'); 

        if (!myUserId) {
            alert("Сначала зарегистрируйся в профиле!");
            window.location.href = "/profile";
        }

        function searchUser() {
            let query = document.getElementById('search-input').value.trim();
            if(!query) return;

            fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            })
            .then(res => res.json())
            .then(data => {
                let resDiv = document.getElementById('search-result');
                if (data.error) {
                    resDiv.innerHTML = `<p style="color:red;">${data.error}</p>`;
                } else {
                    resDiv.innerHTML = `
                        <div class="user-card" style="background:#1A1A1A; padding:15px; border-radius:5px; display:flex; gap:15px; cursor:pointer;" onclick="openChat(${data.id}, '${data.name}', '${data.username}', '${data.avatar}')">
                            <div style="font-size:30px;">${data.avatar}</div>
                            <div>
                                <h3 style="margin:0; color:#E65C00;">${data.name}</h3>
                                <p style="margin:0; color:#888;">@${data.username}</p>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function openChat(id, name, username, avatar) {
            currentChatUser = id;
            document.getElementById('search-view').style.display = 'none';
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('chat-avatar').innerText = avatar;
            document.getElementById('chat-name').innerText = name;
            document.getElementById('chat-username').innerText = "@" + username;
            loadMessages();
        }

        function backToSearch() {
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('search-view').style.display = 'block';
            currentChatUser = null;
        }

        function loadMessages() {
            fetch(`/api/messages?sender_id=${myUserId}&receiver_id=${currentChatUser}`)
            .then(res => res.json())
            .then(msgs => {
                let box = document.getElementById('chat-messages');
                box.innerHTML = '';
                msgs.forEach(m => {
                    let cls = (m.sender_id == myUserId) ? 'my' : 'their';
                    box.innerHTML += `<div class="msg ${cls}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            let text = document.getElementById('msg-input').value.trim();
            if(!text || !currentChatUser) return;

            fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sender_id: myUserId, receiver_id: currentChatUser, text: text})
            }).then(() => {
                document.getElementById('msg-input').value = '';
                loadMessages();
            });
        }

        function logout() {
            localStorage.removeItem('toni_user_id');
            window.location.href = "/profile";
        }
    </script>
</body>
</html>/
